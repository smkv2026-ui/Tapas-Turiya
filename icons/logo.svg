<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tapas Turiya — bloomed lotus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1330"/>
      <stop offset="0.55" stop-color="#16328C"/>
      <stop offset="1" stop-color="#2D6BE4"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#8FD3FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4E9BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E0508F"/>
      <stop offset="0.6" stop-color="#F58DB8"/>
      <stop offset="1" stop-color="#FFD6E6"/>
    </linearGradient>
    <linearGradient id="pMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EE6FA4"/>
      <stop offset="0.6" stop-color="#FFB3D0"/>
      <stop offset="1" stop-color="#FFF0F6"/>
    </linearGradient>
    <linearGradient id="pFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9CC4"/>
      <stop offset="0.55" stop-color="#FFE0EC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="1" stop-color="#F4B63B"/>
    </radialGradient>
    <path id="p" d="M0,0 C 36,-34 40,-112 0,-176 C -40,-112 -36,-34 0,0 Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.2) translate(-256 -312)">
  <circle cx="256" cy="300" r="215" fill="url(#aura)"/>

  <!-- water ripples -->
  <g fill="none" stroke-linecap="round">
    <path d="M96 392 Q256 428 416 392" stroke="#FFFFFF" stroke-width="9" opacity="0.9"/>
    <path d="M140 420 Q256 448 372 420" stroke="#9FD0FF" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- fully open lotus: three fanned rows of petals, back to front -->
  <g transform="translate(256 384)" stroke-linejoin="round">
    <g stroke="#C23B79" stroke-width="2.5" stroke-opacity="0.55">
      <use href="#p" transform="rotate(-84) scale(0.9)"  fill="url(#pBack)"/>
      <use href="#p" transform="rotate(84) scale(0.9)"   fill="url(#pBack)"/>
      <use href="#p" transform="rotate(-60) scale(1.04)" fill="url(#pBack)"/>
      <use href="#p" transform="rotate(60) scale(1.04)"  fill="url(#pBack)"/>
      <use href="#p" transform="rotate(-32) scale(1.14)" fill="url(#pBack)"/>
      <use href="#p" transform="rotate(32) scale(1.14)"  fill="url(#pBack)"/>
    </g>
    <g stroke="#D9578F" stroke-width="2.5" stroke-opacity="0.5">
      <use href="#p" transform="rotate(-70) scale(0.8)"  fill="url(#pMid)"/>
      <use href="#p" transform="rotate(70) scale(0.8)"   fill="url(#pMid)"/>
      <use href="#p" transform="rotate(-42) scale(0.92)" fill="url(#pMid)"/>
      <use href="#p" transform="rotate(42) scale(0.92)"  fill="url(#pMid)"/>
      <use href="#p" transform="rotate(-14) scale(1.0)"  fill="url(#pMid)"/>
      <use href="#p" transform="rotate(14) scale(1.0)"   fill="url(#pMid)"/>
    </g>
    <g stroke="#E27AA8" stroke-width="2.5" stroke-opacity="0.45">
      <use href="#p" transform="rotate(-50) scale(0.6)" fill="url(#pFront)"/>
      <use href="#p" transform="rotate(50) scale(0.6)"  fill="url(#pFront)"/>
      <use href="#p" transform="rotate(-24) scale(0.72)" fill="url(#pFront)"/>
      <use href="#p" transform="rotate(24) scale(0.72)"  fill="url(#pFront)"/>
      <use href="#p" transform="scale(0.8)" fill="url(#pFront)"/>
    </g>
    <!-- golden heart of the flower -->
    <ellipse cx="0" cy="-30" rx="26" ry="20" fill="url(#core)" stroke="#E39A1C" stroke-width="2.5"/>
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="-11" cy="-34" r="3"/><circle cx="0" cy="-38" r="3"/><circle cx="11" cy="-34" r="3"/>
      <circle cx="-5" cy="-26" r="2.5"/><circle cx="6" cy="-26" r="2.5"/>
    </g>
  </g>
  </g>
</svg>
